<!-- Dukaan Digital poster template, 1080 x 1080.
     Source of truth for the design. n8n/code/08_build_poster.js contains the same markup in its TEMPLATE constant;
     if you change this file, copy it into that constant (Claude Code can do this: "sync the poster template").
     Placeholders: {{BRAND}} {{ACCENT}} {{SHOP_BN}} {{SHOP_EN}} {{PHOTO}} {{BADGE}} {{BADGE_DISPLAY}}
                   {{HEADLINE}} {{SUBLINE}} {{PRICE}} {{PRICE_DISPLAY}} {{FOOTER}} -->
<div class="poster">
  <div class="dots"></div>
  <header>
    <div class="shop-bn">{{SHOP_BN}}</div>
    <div class="shop-en">{{SHOP_EN}}</div>
  </header>
  <div class="photo-wrap">
    <img class="photo" src="{{PHOTO}}" alt="">
    <div class="badge" style="display:{{BADGE_DISPLAY}}">{{BADGE}}</div>
    <div class="price" style="display:{{PRICE_DISPLAY}}"><span>{{PRICE}}</span></div>
  </div>
  <div class="headline">{{HEADLINE}}</div>
  <div class="subline">{{SUBLINE}}</div>
  <footer>{{FOOTER}}</footer>
</div>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1080px; }
  .poster { position: relative; width: 1080px; height: 1080px; overflow: hidden;
    background: {{BRAND}}; color: #fff; font-family: 'Hind Siliguri', 'Noto Sans Bengali', 'Poppins', sans-serif;
    display: flex; flex-direction: column; align-items: center; }
  .dots { position: absolute; inset: 0; opacity: .10;
    background-image: radial-gradient({{ACCENT}} 2px, transparent 2.5px); background-size: 34px 34px; }
  header { position: relative; text-align: center; padding-top: 44px; }
  .shop-bn { font-size: 58px; font-weight: 700; color: {{ACCENT}}; line-height: 1.15; }
  .shop-en { font-family: 'Poppins', sans-serif; font-size: 22px; letter-spacing: 4px; text-transform: uppercase; opacity: .85; margin-top: 4px; }
  .photo-wrap { position: relative; margin-top: 30px; width: 900px; height: 560px; }
  .photo { width: 100%; height: 100%; object-fit: cover; border-radius: 28px; border: 8px solid {{ACCENT}};
    box-shadow: 0 18px 40px rgba(0,0,0,.35); background: #3a1020; }
  .badge { position: absolute; top: 28px; left: -18px; background: {{ACCENT}}; color: {{BRAND}};
    font-size: 36px; font-weight: 700; padding: 10px 30px 12px 34px; border-radius: 0 40px 40px 0;
    box-shadow: 0 6px 16px rgba(0,0,0,.3); }
  .price { position: absolute; right: -26px; bottom: -40px; width: 230px; height: 230px; border-radius: 50%;
    background: {{ACCENT}}; color: {{BRAND}}; display: flex; align-items: center; justify-content: center;
    text-align: center; font-weight: 700; font-size: 46px; line-height: 1.05; padding: 22px;
    border: 8px solid {{BRAND}}; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
  .price span { display: block; }
  .price small { display: block; font-size: 32px; font-weight: 600; margin-top: 4px; }
  .headline { position: relative; margin-top: 38px; font-size: 76px; font-weight: 700; text-align: center; line-height: 1.1; padding: 0 60px; }
  .subline { position: relative; margin-top: 10px; font-size: 36px; text-align: center; opacity: .92; padding: 0 80px; }
  footer { position: absolute; bottom: 0; left: 0; right: 0; height: 74px; background: rgba(0,0,0,.28);
    display: flex; align-items: center; justify-content: center; font-size: 28px; letter-spacing: .5px; }
</style>
